<style>
:root{--paper:#f5f7f8;--panel:#fff;--ink:#151d21;--muted:#67777d;--line:#dde4e6;--accent:#0d8fa6;--yes:#2c9c68;--no:#a2adb2}
@media(prefers-color-scheme:dark){:root{--paper:#0c1214;--panel:#141d21;--ink:#e6eef1;--muted:#8598a0;--line:#233036;--accent:#2ab6cc;--yes:#3fb27f;--no:#5a6b72}}
:root[data-theme=dark]{--paper:#0c1214;--panel:#141d21;--ink:#e6eef1;--muted:#8598a0;--line:#233036;--accent:#2ab6cc;--yes:#3fb27f;--no:#5a6b72}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0}.prog{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted)}
.bar{flex:1;min-width:100px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:0}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:18px}
video{width:100%;border-radius:10px;border:1px solid var(--line);background:#000}
.cid{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);margin:6px 0}
.q{font-size:15px;font-weight:600;margin:14px 0 8px}
.yn{display:flex;gap:10px}.yn button{flex:1;padding:12px;font-size:15px;font-weight:600}
.yn button.yes.on{background:var(--yes);border-color:var(--yes);color:#fff}
.yn button.no.on{background:var(--no);border-color:var(--no);color:#fff}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:12px;margin-top:6px}.note{width:100%;margin-top:10px;font:inherit;font-size:12.5px;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--line);border-radius:4px;padding:0 5px}
</style></head><body>
<header><h1>선별-gold</h1><span class=prog id=prog>0/0</span><div class=bar><i id=bf></i></div>
<button id=prev>◀</button><button id=next class=p>다음 ▶</button>
<button id=dl>select_gold.json</button><button id=imp>이어하기</button><input type=file id=fi accept=.json style=display:none></header>
<div class=wrap>
<video id=vid controls preload=metadata loop playsinline></video>
<div class=cid id=cid></div>
<div class=q>이 clip에 추출할 만한 <b>유의미한 상황</b>이 있나요?</div>

<div class=cats id=cats></div>
<textarea class=note id=note rows=2 placeholder="메모(선택)"></textarea>
</div>

const $=s=>document.querySelector(s);
function rec(){const id=CLIPS[idx].id; if(!store[id])store[id]={m:null,cats:[],note:""}; return store[id];}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
function renderCats(){const w=$("#cats");w.innerHTML="";const r=rec();

}
function load(){const c=CLIPS[idx],r=rec();$("#vid").src=c.vid;$("#cid").textContent=(idx+1)+". "+c.id;
  $("#by").classList.toggle("on",r.m===true);$("#bn").classList.toggle("on",r.m===false);
  $("#note").value=r.note||"";renderCats();
  const done=Object.values(store).filter(x=>x.m!==null).length;
  $("#prog").textContent=(idx+1)+"/"+CLIPS.length+" · 라벨 "+done;$("#bf").style.width=(100*(idx+1)/CLIPS.length)+"%";}

$("#by").onclick=()=>{rec().m=true;save();load();setTimeout(()=>go(1),150);};
$("#bn").onclick=()=>{rec().m=false;rec().cats=[];save();load();setTimeout(()=>go(1),150);};
$("#note").oninput=e=>{rec().note=e.target.value;save();};
$("#next").onclick=()=>go(1);$("#prev").onclick=()=>go(-1);

$("#imp").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{store=JSON.parse(rd.result);save();load();alert("불러오기 완료");}catch(x){alert("실패");}};rd.readAsText(f);};

  if(e.key==="y"||e.key==="Y"){$("#by").click();}else if(e.key==="n"||e.key==="N"){$("#bn").click();}
  else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);
  else if(e.key===" "){e.preventDefault();const v=$("#vid");v.paused?v.play():v.pause();}};
